<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>応援帳 正式版 v0.1</title><style>
body{margin:0;background:#f5f6f8;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}header{background:#111827;color:white;padding:16px}main{max-width:760px;margin:auto;padding:14px 14px 90px}.page{display:none}.page.active{display:block}.card,.item{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpi{font-size:23px;font-weight:800}small,.meta{color:#6b7280}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;margin-bottom:9px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}button{padding:11px;border:0;border-radius:10px;font-weight:700}button.primary{background:#111827;color:white}button.danger{background:#fee2e2;color:#991b1b}nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex;overflow:auto}nav button{background:white;color:#555;min-width:75px}nav button.active{color:#111;font-weight:800}.score{text-align:center;font-size:30px;font-weight:900;padding:12px}</style></head><body>
<header><b>応援帳</b><br><small style="color:#bbb">正式版 v0.1｜現場→売上→請求</small></header><main>
<section id="home" class="page active"><h2>今月の状況</h2><div class="grid"><div class="card"><small>売上</small><div id="sales" class="kpi">¥0</div></div><div class="card"><small>経費</small><div id="expenses" class="kpi">¥0</div></div><div class="card"><small>粗利益目安</small><div id="profit" class="kpi">¥0</div></div><div class="card"><small>人工</small><div id="days" class="kpi">0</div></div></div><div class="card" id="advice">まず日報を1件登録。</div></section>
<section id="sites" class="page"><h2>現場・取引先</h2><div class="card"><div class="row"><input id="client" placeholder="取引先"><input id="site" placeholder="現場名"></div><input id="rate" type="number" placeholder="人工単価"><button class="primary" onclick="addSite()">登録</button></div><div id="siteList"></div></section>
<section id="daily" class="page"><h2>日報・人工</h2><div class="card"><input id="date" type="date"><select id="siteSelect"></select><div class="row"><input id="workDays" type="number" step=".25" placeholder="人工"><input id="dailyRate" type="number" placeholder="単価"></div><input id="work" placeholder="作業内容"><button class="primary" onclick="addDaily()">日報を登録</button></div><div id="dailyList"></div></section>
<section id="expense" class="page"><h2>経費</h2><div class="card"><input id="expDate" type="date"><input id="amount" type="number" placeholder="金額"><input id="memo" placeholder="高速・燃料・工具など"><button class="primary" onclick="addExp()">登録</button></div><div id="expList"></div></section>
<section id="invoice" class="page"><h2>請求書プレビュー</h2><div class="card"><input id="invoiceClient" placeholder="請求先"><input id="issuer" placeholder="発行者名・屋号"><input id="invoiceNo" placeholder="インボイス登録番号（任意）"><button class="primary" onclick="invoice()">今月分を集計</button></div><div id="preview" class="card">ここに請求書プレビューが出ます。</div></section>
<section id="diagnosis" class="page"><h2>単価診断</h2><div class="card"><div class="row"><input id="pRate" type="number" placeholder="単価/人工"><input id="pDays" type="number" step=".25" placeholder="月人工"></div><div class="row"><input id="fuel" type="number" placeholder="交通・燃料/月"><input id="other" type="number" placeholder="その他経費/月"></div><button class="primary" onclick="diagnose()">診断</button><div id="result"></div></div></section>
<section id="settings" class="page"><h2>データ管理</h2><div class="card"><button onclick="backup()">JSONバックアップ</button> <button onclick="resetDB()">全削除</button><p class="meta">現在は端末内保存の試作版。正式サービスではログイン・クラウド同期・権限・バックアップ・セキュリティを追加します。</p></div></section>
</main><nav>
<button class="active" onclick="go('home',this)">ホーム</button><button onclick="go('sites',this)">現場</button><button onclick="go('daily',this)">日報</button><button onclick="go('expense',this)">経費</button><button onclick="go('invoice',this)">請求</button><button onclick="go('diagnosis',this)">単価</button><button onclick="go('settings',this)">設定</button></nav>
<script>
const K="ouencho_v01";let db=JSON.parse(localStorage.getItem(K)||'{"sites":[],"daily":[],"expenses":[]}');let today=new Date().toISOString().slice(0,10);date.value=today;expDate.value=today;
function save(){localStorage.setItem(K,JSON.stringify(db));render()}function yen(n){return"¥"+Math.round(n).toLocaleString()}function esc(s){return String(s||"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]))}
function go(id,b){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()}
function addSite(){if(!client.value||!site.value)return alert("取引先と現場名を入力");db.sites.push({id:Date.now(),client:client.value,site:site.value,rate:+rate.value||0});client.value=site.value=rate.value="";save()}
function addDaily(){let s=db.sites.find(x=>x.id==siteSelect.value);if(!s||!workDays.value)return alert("現場と人工を入力");db.daily.push({id:Date.now(),date:date.value,site:s.id,days:+workDays.value,rate:+dailyRate.value||s.rate,work:work.value});work.value="";save()}
function addExp(){if(!amount.value)return alert("金額を入力");db.expenses.push({id:Date.now(),date:expDate.value,amount:+amount.value,memo:memo.value});amount.value=memo.value="";save()}
function del(t,id){if(confirm("削除しますか？")){db[t]=db[t].filter(x=>x.id!=id);save()}}
function render(){siteSelect.innerHTML='<option value="">現場を選択</option>'+db.sites.map(s=>`<option value="${s.id}">${esc(s.client)} / ${esc(s.site)}</option>`).join("");siteList.innerHTML=db.sites.map(s=>`<div class=item><b>${esc(s.client)}｜${esc(s.site)}</b><div class=meta>${yen(s.rate)} / 人工</div><button class=danger onclick="del('sites',${s.id})">削除</button></div>`).join("")||"<div class=card>現場なし</div>";dailyList.innerHTML=db.daily.slice().reverse().map(x=>{let s=db.sites.find(a=>a.id==x.site);return`<div class=item><b>${x.date}｜${esc(s?.site||"削除済み")}</b><div class=meta>${esc(x.work)} / ${x.days}人工 × ${yen(x.rate)}</div><b>${yen(x.days*x.rate)}</b><br><button class=danger onclick="del('daily',${x.id})">削除</button></div>`}).join("")||"<div class=card>日報なし</div>";expList.innerHTML=db.expenses.slice().reverse().map(x=>`<div class=item>${x.date}｜${esc(x.memo)}<br><b>${yen(x.amount)}</b><br><button class=danger onclick="del('expenses',${x.id})">削除</button></div>`).join("")||"<div class=card>経費なし</div>";let ym=today.slice(0,7),d=db.daily.filter(x=>x.date.startsWith(ym)),e=db.expenses.filter(x=>x.date.startsWith(ym)),s=d.reduce((a,x)=>a+x.days*x.rate,0),ex=e.reduce((a,x)=>a+x.amount,0);sales.textContent=yen(s);expenses.textContent=yen(ex);profit.textContent=yen(s-ex);days.textContent=d.reduce((a,x)=>a+x.days,0);advice.textContent=d.length?(s-ex>0?"粗利益はプラス。次は請求漏れゼロを目指そう。":"経費と単価を見直そう。"):"まず日報を1件登録。"}
function invoice(){let c=invoiceClient.value.trim(),d=db.daily.filter(x=>x.date.startsWith(today.slice(0,7))).filter(x=>!c||db.sites.find(s=>s.id==x.site)?.client==c),sub=d.reduce((a,x)=>a+x.days*x.rate,0),tax=Math.floor(sub*.1);preview.innerHTML=`<h3>請求書</h3><p>${esc(c||"取引先")} 御中</p><p>発行者：${esc(issuer.value||"未設定")}</p><hr><p>税抜：${yen(sub)}<br>消費税10%：${yen(tax)}</p><h2>請求額：${yen(sub+tax)}</h2><p class=meta>登録番号：${esc(invoiceNo.value||"未設定")}<br>※正式版では法定記載事項・PDF出力を実装。</p>`}
function diagnose(){let r=+pRate.value||0,d=+pDays.value||0,c=(+fuel.value||0)+(+other.value||0),sales=r*d,net=sales-c,per=d?net/d:0;result.innerHTML=`<div class=score>${yen(per)} / 人工</div><p>月売上 ${yen(sales)} ／ 経費 ${yen(c)} ／ 差引 ${yen(net)}</p><p>${net<0?"赤字の条件。単価・人工・移動費を見直そう。":per<8000?"利益が薄め。":"ひとまず利益は確保できる計算。"}</p>`}
function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="ouencho-backup.json";a.click()}function resetDB(){if(confirm("全データを削除？")){db={sites:[],daily:[],expenses:[]};save()}}render();
</script></body></html>
